document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e83cf86c-d347-4915-a97e-9ad43fdf0702\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n\n  /* ============================================================\n     COLOR — Tokens\n     ============================================================ */\n\n  /* Ink (primary brand neutral). Confirmed by client: #0E0E0E ink,\n     #242424 mid surface, #FFFFFF paper. The scale interpolates.   */\n  --color-ink-900: #0e0e0e;     /* signature ink   */\n  --color-ink-850: #242424;     /* mid dark surface */\n  --color-ink-800: #1a1a1a;\n  --color-ink-700: #2f2f2f;     /* graphite        */\n  --color-ink-600: #494949;     /* pencil          */\n  --color-ink-500: #6e6e6e;     /* dust            */\n  --color-ink-400: #8a8a8a;     /* stone           */\n  --color-ink-300: #b4b4b4;     /* fog             */\n  --color-ink-200: #d4d4d4;     /* edge            */\n  --color-ink-100: #e7e7e7;     /* sheet           */\n  --color-ink-050: #f2f2f2;     /* whisper         */\n\n  /* Paper (background neutrals). White is the canvas; off-greys\n     act as sunken/elevated planes. */\n  --color-paper:       #ffffff;\n  --color-paper-warm:  #f5f5f5;\n  --color-paper-cool:  #fafafa;\n  --color-plate:       #ffffff;\n  --color-slate:       #242424;   /* dark surface, on-ink reverse */\n  --color-slate-deep:  #0e0e0e;\n\n  /* Stamp Red — the ink-pad accent. Used sparingly; like a stamp\n     pressed onto paper. NOT a brand red for everything — it's a\n     signal: emphasis, mark, \"assinado\".                          */\n  --color-stamp-700:   #8a2620;\n  --color-stamp-600:   #a52d24;\n  --color-stamp-500:   #c8392e;   /* primary stamp */\n  --color-stamp-400:   #db5a4f;\n  --color-stamp-200:   #f3c8c2;\n  --color-stamp-050:   #fbeeec;\n\n  /* Quiet utility tints — used very sparingly */\n  --color-jade-500:    #2f7d5b;\n  --color-amber-500:   #c98a2a;\n  --color-azure-500:   #2a5f8a;\n\n  /* ============================================================\n     COLOR — Semantic\n     ============================================================ */\n\n  /* Foreground */\n  --fg-1:        var(--color-ink-900);  /* primary text       */\n  --fg-2:        var(--color-ink-700);  /* secondary text     */\n  --fg-3:        var(--color-ink-500);  /* tertiary / meta    */\n  --fg-4:        var(--color-ink-400);  /* hint / disabled    */\n  --fg-on-ink:   var(--color-paper);    /* on dark surfaces   */\n  --fg-on-stamp: var(--color-paper);    /* on stamp red       */\n\n  /* Background */\n  --bg-page:        var(--color-paper);\n  --bg-elevated:    var(--color-plate);\n  --bg-sunken:      var(--color-paper-warm);\n  --bg-inverse:     var(--color-slate);\n  --bg-inverse-deep:var(--color-slate-deep);\n  --bg-accent:      var(--color-stamp-500);\n\n  /* Border */\n  --border-hair:    rgba(14, 14, 14, 0.08);\n  --border-soft:    rgba(14, 14, 14, 0.14);\n  --border-strong:  rgba(14, 14, 14, 0.92);\n  --border-on-ink:  rgba(255, 255, 255, 0.14);\n\n  /* Accent */\n  --accent:         var(--color-stamp-500);\n  --accent-hover:   var(--color-stamp-600);\n  --accent-press:   var(--color-stamp-700);\n  --accent-soft:    var(--color-stamp-050);\n\n  /* Status */\n  --status-success: var(--color-jade-500);\n  --status-warning: var(--color-amber-500);\n  --status-info:    var(--color-azure-500);\n  --status-danger:  var(--color-stamp-500);\n\n  /* ============================================================\n     TYPE — Families\n     ============================================================ */\n\n  --font-display:   \"Funnel Display\", \"Arial Black\", system-ui, sans-serif;\n  --font-signature: \"Funnel Display\", \"Arial Black\", system-ui, sans-serif;\n  --font-body:      \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-mono:      \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ============================================================\n     TYPE — Scale (modular, modest)\n     ============================================================ */\n\n  --fs-12: 12px;\n  --fs-13: 13px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-22: 22px;\n  --fs-26: 26px;\n  --fs-32: 32px;\n  --fs-40: 40px;\n  --fs-52: 52px;\n  --fs-68: 68px;\n  --fs-88: 88px;\n  --fs-120: 120px;\n\n  /* ============================================================\n     SPACING & RADII\n     ============================================================ */\n\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   8px;\n  --radius-lg:   14px;\n  --radius-xl:   22px;\n  --radius-pill: 999px;\n\n  /* ============================================================\n     ELEVATION — Ink-on-paper, low shadows. The brand is flat\n     and editorial. Never use heavy drop shadows.\n     ============================================================ */\n  --shadow-1: 0 1px 0 rgba(14,14,14,0.06);\n  --shadow-2: 0 1px 2px rgba(14,14,14,0.06), 0 1px 0 rgba(14,14,14,0.04);\n  --shadow-3: 0 6px 18px -8px rgba(14,14,14,0.16), 0 1px 0 rgba(14,14,14,0.06);\n  --shadow-press: inset 0 1px 0 rgba(14,14,14,0.18);\n\n  /* Stamp shadow — the ONE expressive shadow we allow: a rotated,\n     ink-bleed feel for buttons and signature elements. */\n  --shadow-stamp: 2px 2px 0 var(--color-ink-900);\n\n  /* Motion */\n  --ease-out:   cubic-bezier(0.2, 0.7, 0.2, 1);   /* @kind other */\n  --ease-in:    cubic-bezier(0.4, 0, 1, 1);        /* @kind other */\n  --ease-press: cubic-bezier(0.3, 0.7, 0.4, 1);    /* @kind other */\n  --dur-fast:   120ms;   /* @kind other */\n  --dur-base:   220ms;   /* @kind other */\n  --dur-slow:   420ms;   /* @kind other */\n\n  /* Container widths */\n  --w-narrow: 760px;\n  --w-wide:   1180px;\n}\n\n/* ============================================================\n   TYPE — Semantic mixin classes\n   Use as class names OR copy declarations into your selectors.\n   ============================================================ */\n\n.t-display-xl {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(56px, 8vw, var(--fs-120));\n  line-height: 0.98;\n  letter-spacing: -0.02em;\n  text-transform: none;\n  color: var(--fg-1);\n}\n\n.t-display {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(40px, 5.5vw, var(--fs-88));\n  line-height: 1.0;\n  letter-spacing: -0.02em;\n  text-transform: none;\n  color: var(--fg-1);\n}\n\n.t-h1 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--fs-52);\n  line-height: 1.05;\n  letter-spacing: -0.015em;\n  text-transform: none;\n  color: var(--fg-1);\n}\n\n.t-h2 {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: var(--fs-32);\n  line-height: 1.12;\n  letter-spacing: -0.015em;\n  color: var(--fg-1);\n}\n\n.t-h3 {\n  font-family: var(--font-body);\n  font-weight: 600;\n  font-size: var(--fs-22);\n  line-height: 1.2;\n  letter-spacing: -0.01em;\n  color: var(--fg-1);\n}\n\n.t-eyebrow {\n  font-family: var(--font-display);\n  font-weight: 500;\n  font-size: var(--fs-13);\n  letter-spacing: 0.04em;\n  text-transform: none;\n  color: var(--fg-2);\n}\n\n.t-numeral {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: var(--fs-13);\n  letter-spacing: 0.02 0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e83cf86c-d347-4915-a97e-9ad43fdf0702\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n\n  /* ============================================================\n     COLOR — Tokens\n     ============================================================ */\n\n  /* Ink (primary brand neutral). Confirmed by client: #0E0E0E ink,\n     #242424 mid surface, #FFFFFF paper. The scale interpolates.   */\n  --color-ink-900: #0e0e0e;     /* signature ink   */\n  --color-ink-850: #242424;     /* mid dark surface */\n  --color-ink-800: #1a1a1a;\n  --color-ink-700: #2f2f2f;     /* graphite        */\n  --color-ink-600: #494949;     /* pencil          */\n  --color-ink-500: #6e6e6e;     /* dust            */\n  --color-ink-400: #8a8a8a;     /* stone           */\n  --color-ink-300: #b4b4b4;     /* fog             */\n  --color-ink-200: #d4d4d4;     /* edge            */\n  --color-ink-100: #e7e7e7;     /* sheet           */\n  --color-ink-050: #f2f2f2;     /* whisper         */\n\n  /* Paper (background neutrals). White is the canvas; off-greys\n     act as sunken/elevated planes. */\n  --color-paper:       #ffffff;\n  --color-paper-warm:  #f5f5f5;\n  --color-paper-cool:  #fafafa;\n  --color-plate:       #ffffff;\n  --color-slate:       #242424;   /* dark surface, on-ink reverse */\n  --color-slate-deep:  #0e0e0e;\n\n  /* Stamp Red — the ink-pad accent. Used sparingly; like a stamp\n     pressed onto paper. NOT a brand red for everything — it's a\n     signal: emphasis, mark, \"assinado\".                          */\n  --color-stamp-700:   #8a2620;\n  --color-stamp-600:   #a52d24;\n  --color-stamp-500:   #c8392e;   /* primary stamp */\n  --color-stamp-400:   #db5a4f;\n  --color-stamp-200:   #f3c8c2;\n  --color-stamp-050:   #fbeeec;\n\n  /* Quiet utility tints — used very sparingly */\n  --color-jade-500:    #2f7d5b;\n  --color-amber-500:   #c98a2a;\n  --color-azure-500:   #2a5f8a;\n\n  /* ============================================================\n     COLOR — Semantic\n     ============================================================ */\n\n  /* Foreground */\n  --fg-1:        var(--color-ink-900);  /* primary text       */\n  --fg-2:        var(--color-ink-700);  /* secondary text     */\n  --fg-3:        var(--color-ink-500);  /* tertiary / meta    */\n  --fg-4:        var(--color-ink-400);  /* hint / disabled    */\n  --fg-on-ink:   var(--color-paper);    /* on dark surfaces   */\n  --fg-on-stamp: var(--color-paper);    /* on stamp red       */\n\n  /* Background */\n  --bg-page:        var(--color-paper);\n  --bg-elevated:    var(--color-plate);\n  --bg-sunken:      var(--color-paper-warm);\n  --bg-inverse:     var(--color-slate);\n  --bg-inverse-deep:var(--color-slate-deep);\n  --bg-accent:      var(--color-stamp-500);\n\n  /* Border */\n  --border-hair:    rgba(14, 14, 14, 0.08);\n  --border-soft:    rgba(14, 14, 14, 0.14);\n  --border-strong:  rgba(14, 14, 14, 0.92);\n  --border-on-ink:  rgba(255, 255, 255, 0.14);\n\n  /* Accent */\n  --accent:         var(--color-stamp-500);\n  --accent-hover:   var(--color-stamp-600);\n  --accent-press:   var(--color-stamp-700);\n  --accent-soft:    var(--color-stamp-050);\n\n  /* Status */\n  --status-success: var(--color-jade-500);\n  --status-warning: var(--color-amber-500);\n  --status-info:    var(--color-azure-500);\n  --status-danger:  var(--color-stamp-500);\n\n  /* ============================================================\n     TYPE — Families\n     ============================================================ */\n\n  --font-display:   \"Funnel Display\", \"Arial Black\", system-ui, sans-serif;\n  --font-signature: \"Funnel Display\", \"Arial Black\", system-ui, sans-serif;\n  --font-body:      \"Inter\", system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-mono:      \"JetBrains Mono\", ui-monospace, \"SF Mono\", Menlo, monospace;\n\n  /* ============================================================\n     TYPE — Scale (modular, modest)\n     ============================================================ */\n\n  --fs-12: 12px;\n  --fs-13: 13px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-16: 16px;\n  --fs-18: 18px;\n  --fs-20: 20px;\n  --fs-22: 22px;\n  --fs-26: 26px;\n  --fs-32: 32px;\n  --fs-40: 40px;\n  --fs-52: 52px;\n  --fs-68: 68px;\n  --fs-88: 88px;\n  --fs-120: 120px;\n\n  /* ============================================================\n     SPACING & RADII\n     ============================================================ */\n\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  --radius-none: 0;\n  --radius-xs:   2px;\n  --radius-sm:   4px;\n  --radius-md:   8px;\n  --radius-lg:   14px;\n  --radius-xl:   22px;\n  --radius-pill: 999px;\n\n  /* ============================================================\n     ELEVATION — Ink-on-paper, low shadows. The brand is flat\n     and editorial. Never use heavy drop shadows.\n     ============================================================ */\n  --shadow-1: 0 1px 0 rgba(14,14,14,0.06);\n  --shadow-2: 0 1px 2px rgba(14,14,14,0.06), 0 1px 0 rgba(14,14,14,0.04);\n  --shadow-3: 0 6px 18px -8px rgba(14,14,14,0.16), 0 1px 0 rgba(14,14,14,0.06);\n  --shadow-press: inset 0 1px 0 rgba(14,14,14,0.18);\n\n  /* Stamp shadow — the ONE expressive shadow we allow: a rotated,\n     ink-bleed feel for buttons and signature elements. */\n  --shadow-stamp: 2px 2px 0 var(--color-ink-900);\n\n  /* Motion */\n  --ease-out:   cubic- ht:200px;border-radius:22px;background:#fff;border:1px solid var(--hair);padding:26px;transition:transform .3s var(--e),box-shadow .3s var(--e),border-color .3s var(--e)\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n          <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#0A0A0A\" stroke-width=\"1.15\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 5h4l3 15h16\"></path><path d=\"M9 9h20l-3 8H10.5\"></path><circle cx=\"12\" cy=\"26\" r=\"2\"></circle><circle cx=\"24\" cy=\"26\" r=\"2\"></circle><path d=\"M17 11v4M15 13h4\" stroke=\"#9DC44D\"></path></svg>\n          <span style=\"font-family:'Funnel Display',sans-serif;font-size:12px;letter-spacing:.02em;color:var(--ink-4)\">07</span>\n        </div>\n        <div>\n          <h3 style=\"font-family:'Funnel Display',sans-serif;font-weight:400;font-size:clamp(19px,1.6vw,23px);line-height:1.12;letter-spacing:-.02em\">E-commerces</h3>\n          <div data-cardrule=\"1\" style=\"margin-top:16px;height:1px;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--e)\"></div>\n        </div>\n      </div>\n      <div data-r=\"1\" data-card=\"1\" data-seg-card=\"1\" style=\"position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:200px;border-radius:22px;background:#fff;border:1px solid var(--hair);padding:26px;transition:transform .3s var(--e),box-shadow .3s var(--e),border-color .3s var(--e)\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n          <svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 32 32\" fill=\"none\" stroke=\"#0A0A0A\" stroke-width=\"1.15\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12v8l14 7V5z\"></path><path d=\"M18 10c4 0 7 2.7 7 6s-3 6-7 6\" stroke=\"#9DC44D\"></path><path d=\"M4 20H2v-8h2\"></path></svg>\n          <span style=\"font-family:'Funnel Display',sans-serif;font-size:12px;letter-spacing:.02em;color:var(--ink-4)\">08</span>\n        </div>\n        <div>\n          <h3 style=\"font-family:'Funnel Display',sans-serif;font-weight:400;font-size:clamp(19px,1.6vw,23px);line-height:1.12;letter-spacing:-.02em\">Negócios que já investem ou desejam investir em marketing</h3>\n          <div data-cardrule=\"1\" style=\"margin-top:16px;height:1px;background:var(--lime);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--e)\"></div>\n        </div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<section id=\"participar\" style=\"position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:clamp(72px,9vw,132px) clamp(18px,4.4vw,28px)\">\n  <div data-r=\"1\" style=\"position:relative;overflow:hidden;border-radius:28px;background:var(--ink);color:#fff;border:1px solid rgba(255,255,255,.08);box-shadow:0 60px 120px -70px rgba(10,10,10,.7)\">\n    <div style=\"position:absolute;right:-120px;top:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(157,196,77,.18),transparent 62%);pointer-events:none\"></div>\n    <div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:clamp(36px,4.5vw,72px);padding:clamp(32px,5vw,72px)\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.13em;color:rgba(255,255,255,.45)\"><span style=\"width:26px;height:1px;background:var(--lime)\"></span>07 / PARTICIPAR</div>\n        <h2 style=\"margin-top:24px;font-family:'Funnel Display',sans-serif;font-weight:400;font-size:clamp(34px,4.2vw,60px);line-height:1.02;letter-spacing:-.028em;color:#fff;text-wrap:balance\">Faça parte da comunidade da FIRMA</h2>\n        <p style=\"margin-top:26px;max-width:480px;font-size:clamp(15.5px,1.25vw,18px);line-height:1.6;color:rgba(255,255,255,.8)\">Receba gratuitamente um diagnóstico estratégico que normalmente faz parte de um projeto de consultoria de <span style=\"color:var(--lime-glow);font-weight:600;font-size:1.2em\">R$ 15.000</span>.</p>\n        <p style=\"margin-top:16px;max-width:480px;font-size:clamp(15.5px,1.25vw,18px);line-height:1.6;color:rgba(255,255,255,.8)\">Entre no grupo e participe da seleção das próximas empresas analisadas.</p>\n        <div style=\"margin-top:38px;display:flex;flex-wrap:wrap;gap:10px\">\n          <span style=\"padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.65)\">SEM CUSTO</span>\n          <span style=\"padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.14);font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.65)\">SEM COMPROMISSO</span>\n          <span style=\"padding:9px 14px;border-radius:999px;border:1px solid rgba(157,196,77,.4);background:rgba(157,196,77,.1);font-size:11.5px;letter-spacing:.08em;color:var(--lime-glow)\">VAGAS LIMITADAS POR RODADA</span>\n        </div>\n      </div>\n\n      <div style=\"border-radius:22px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(14px);padding:clamp(24px,3vw,34px)\">\n        <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:18px\">\n            <span style=\"width:46px;height:46px;border-radius:50%;background:var(--lime);display:grid;place-items:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\" fill=\"none\" stroke=\"#0A0A0A\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M3.5 10.5 8 15l8.5-10\"></path></svg></span>\n            <p style=\"font-family:'Funnel Display',sans-serif;font-size:28px;line-height:1.1;letter-spacing:-.02em;color:#fff\">Recebemos seus dados.</p>\n            <p style=\"font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.7);max-width:340px\">Enviaremos o convite do grupo oficial da FIRMA para o contato informado.</p>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <form sc-camel-on-submit=\"{{ submit }}\">\n            <div style=\"font-size:11px;letter-spacing:.13em;color:rgba(255,255,255,.45)\">ENTRAR NO GRUPO</div>\n            <div style=\"margin-top:22px;display:flex;flex-direction:column;gap:14px\">\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.5);margin-bottom:8px\">NOME</span>\n                <input data-field=\"1\" name=\"nome\" required=\"required\" placeholder=\"Como podemos te chamar?\" style=\"width:100%;padding:15px 17px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#fff;outline:none;font-size:15px;transition:border-color .2s var(--e),background .2s var(--e)\">\n              </label>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.5);margin-bottom:8px\">E-MAIL</span>\n                <input data-field=\"1\" name=\"email\" type=\"email\" required=\"required\" placeholder=\"voce@suaempresa.com.br\" style=\"width:100%;padding:15px 17px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#fff;outline:none;font-size:15px;transition:border-color .2s var(--e),background .2s var(--e)\">\n              </label>\n              <label style=\"display:block\">\n                <span style=\"display:block;font-size:11.5px;letter-spacing:.08em;color:rgba(255,255,255,.5);margin-bottom:8px\">WHATSAPP</span>\n                <input data-field=\"1\" name=\"whatsapp\" required=\"required\" placeholder=\"(11) 99999-9999\" style=\"width:100%;padding:15px 17px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#fff;outline:none;font-size:15px;transition:border-color .2s var(--e),background .2s var(--e)\">\n              </label>\n            </div>\n            <button type=\"submit\" data-magnet=\"1\" data-cta=\"1\" style=\"margin-top:24px;width:100%;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:14px;padding:19px 24px;border-radius:999px;background:var(--lime);border:none;color:var(--ink);font-size:13.5px;letter-spacing:.06em;transition:transform .3s var(--e),box-shadow .3s var(--e)\">\n              QUERO PARTICIPAR GRATUITAMENTE\n              <span data-arrow=\"1\" style=\"width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 12 12\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 6h8M6.5 2.5 10 6l-3.5 3.5\"></path></svg></span>\n            </button>\n            <p style=\"margin-top:18px;font-size:12px;line-height:1.6;color:rgba(255,255,255,.45)\">Sem custo. Sem compromisso. Apenas empresas realmente interessadas em crescer com estratégia.</p>\n          </form>\n        </sc-if>\n      </div>\n    </div>\n  </div>\n</section>\n\n<footer style=\"position:relative;z-index:1;border-top:1px solid var(--hair);background:rgba(255,255,255,.6)\">\n  <div style=\"max-width:1180px;margin:0 auto;padding:44px clamp(18px,4.4vw,28px);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px\">\n    <div style=\"display:flex;align-items:center\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIEAAACPCAYAAADdqrggAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAOdEVYdFNvZnR3YXJlAEZpZ21hnrGWYwAANGdJREFUeAHtXet527qyHeXc/5s+DWymgigVhKkgSgVWKohTgZUKolRguQIrFZiuIHIFZho4YQo4RxcLXIscwpJIJc5r7z3fZ4sPEAAxg3kDNPuFIAug3wCnY8oHKMLf/N///vfC/oGvgon9ZAgIzB89en tElement.style;\n    if (this.props.accentColor) {\n      rs.setProperty('--lime', this.props.accentColor);\n      rs.setProperty('--lime-deep', this.props.accentColor);\n      rs.setProperty('--lime-glow', this.props.accentColor);\n    }\n    if (this.props.showNav === false) {\n      root.querySelectorAll('header nav').forEach(n => n.style.display = 'none');\n    } else {\n      root.querySelectorAll('[data-navlink]').forEach(a => { if (window.innerWidth > 900) a.style.display = 'inline'; });\n    }\n\n    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const animate = this.props.scrollAnimations !== false && !reduce;\n\n    // ---- scroll reveal\n    if (animate && 'IntersectionObserver' in window) {\n      const items = [...root.querySelectorAll('[data-r]')];\n      items.forEach(el => {\n        const r = el.getBoundingClientRect();\n        if (r.top > window.innerHeight * 0.9) {\n          el.style.opacity = '0';\n          el.style.transform = 'translateY(20px)';\n          el.style.filter = 'blur(6px)';\n          el.style.transition = 'opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1), filter .8s cubic-bezier(.2,.7,.2,1)';\n          el.dataset.hidden = '1';\n        }\n      });\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((en, i) => {\n          if (!en.isIntersecting) return;\n          const el = en.target;\n          io.unobserve(el);\n          const delay = (Number(el.dataset.i || 0) % 6) * 120;\n          setTimeout(() => {\n            el.style.opacity = '1';\n            el.style.transform = 'none';\n            el.style.filter = 'none';\n            if (el.dataset.count) this.count(el);\n            if (el.dataset.underline) this.drawUnderline(el);\n          }, delay);\n        });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });\n      items.forEach((el, i) => { el.dataset.i = i; io.observe(el); });\n\n      // counters + underline + chart, observed independently\n      const extra = [...root.querySelectorAll('[data-count],[data-underline],[data-draw],[data-fillarea],[data-funnel],[data-seg]')];\n      const io2 = new IntersectionObserver((entries) => {\n        entries.forEach(en => {\n          if (!en.isIntersecting) return;\n          const el = en.target;\n          io2.unobserve(el);\n          if (el.dataset.count) this.count(el);\n          else if (el.dataset.underline) this.drawUnderline(el);\n          else if (el.dataset.draw) this.draw(el);\n          else if (el.dataset.fillarea) el.style.transition = 'opacity 1.2s ease .5s', el.style.opacity = '1';\n          else if (el.dataset.funnel) this.grow(el);\n          else if (el.dataset.seg) { el.style.transform = 'scaleX(1)'; }\n        });\n      }, { threshold: 0.25 });\n      extra.forEach(el => {\n        if (el.dataset.underline) { el.style.transform = 'scaleX(0)'; el.style.transition = 'transform .9s cubic-bezier(.2,.7,.2,1) .35s'; }\n        if (el.dataset.draw) { const L = el.getTotalLength ? el.getTotalLength() : 0; if (L) { el.style.strokeDasharray = L; el.style.strokeDashoffset = L; } }\n        if (el.dataset.funnel) { el.style.transformOrigin = 'center'; el.style.transform = 'scaleX(.2)'; el.style.opacity = '.2'; el.style.transition = 'transform .9s cubic-bezier(.2,.7,.2,1), opacity .9s ease'; }\n        if (el.dataset.seg) { el.style.transform = 'scaleX(0)'; el.style.transition = 'transform 1s cubic-bezier(.2,.7,.2,1) .12s'; }\n        io2.observe(el);\n      });\n    }\n\n    // ---- magnetic buttons\n    if (!reduce) {\n      root.querySelectorAll('[data-magnet]').forEach(btn => {\n        const arrow = btn.querySelector('[data-arrow]');\n        btn.addEventListener('mousemove', (e) => {\n          const r = btn.getBoundingClientRect();\n          const dx = (e.clientX - (r.left + r.width / 2)) / r.width;\n          const dy = (e.clientY - (r.top + r.height / 2)) / r.height;\n          btn.style.transform = 'translate(' + (dx * 7).toFixed(2) + 'px,' + (dy * 5).toFixed(2) + 'px) scale(1.025)';\n          if (arrow) arrow.style.transform = 'translateX(3px)';\n        });\n        btn.addEventListener('mouseleave', () => {\n          btn.style.transform = 'none';\n          if (btn.dataset.cta && btn.style.boxShadow) btn.style.boxShadow = '';\n          if (arrow) arrow.style.transform = 'none';\n        });\n        if (arrow) arrow.style.transition = 'transform .3s cubic-bezier(.2,.7,.2,1)';\n      });\n    }\n\n    // ---- card hover\n    root.querySelectorAll('[data-card]').forEach(c => {\n      const rule = c.querySelector('[data-cardrule]');\n      c.addEventListener('mouseenter', () => {\n        c.style.transform = 'translateY(-5px)';\n        c.style.boxShadow = '0 34px 60px -40px rgba(10,10,10,.3)';\n        if (!c.style.color) c.style.borderColor = 'rgba(84,113,31,.34)';\n        if (rule) rule.style.transform = 'scaleX(1)';\n      });\n      c.addEventListener('mouseleave', () => {\n        c.style.transform = 'none'; c.style.boxShadow = ''; c.style.borderColor = '';\n        if (rule) rule.style.transform = 'scaleX(0)';\n      });\n    });\n    // timeline: 5 across on desktop/tablet, stacked only when genuinely narrow\n    const tl = root.querySelector('[data-timeline]');\n    if (tl) {\n      const segs = [...tl.querySelectorAll('[data-seg]')];\n      const layout = () => {\n        const w = window.innerWidth;\n\n      };\n      layout();\n      window.addEventListener('resize', layout);\n      this._tl = layout;\n    }\n\n    // nav links: hairline underline on hover (no color shift)\n    root.querySelectorAll('[data-navlink]').forEach(a => {\n      a.addEventListener('mouseenter', () => { a.style.borderBottomColor = 'var(--ink)'; a.style.color = 'var(--ink)'; });\n      a.addEventListener('mouseleave', () => { a.style.borderBottomColor = 'transparent'; a.style.color = 'var(--ink-3)'; });\n    });\n\n    // entrega cards: invert to ink on hover via scoped token overrides\n    root.querySelectorAll('[data-invert]').forEach(c => {\n      const icons = [...c.querySelectorAll('svg')].filter(sv => sv.getAttribute('stroke') === '#0A0A0A');\n      icons.forEach(sv => { sv.style.transition = 'stroke .3s cubic-bezier(.2,.7,.2,1)'; });\n      const on = () => {\n        c.style.background = '#0A0A0A';\n        c.style.color = '#fff';\n        c.style.borderColor = '#0A0A0A';\n        c.style.setProperty('--ink', '#ffffff');\n        c.style.setProperty('--ink-2', 'rgba(255,255,255,.82)');\n        c.style.setProperty('--ink-3', 'rgba(255,255,255,.62)');\n        c.style.setProperty('--ink-4', 'rgba(255,255,255,.45)');\n        c.style.setProperty('--hair', 'rgba(255,255,255,.13)');\n        c.style.setProperty('--hair-2', 'rgba(255,255,255,.18)');\n        c.style.setProperty('--grey-2', 'rgba(255,255,255,.06)');\n        c.style.setProperty('--lime-deep', '#C3E67A');\n        icons.forEach(sv => sv.style.stroke = '#ffffff');\n      };\n      const off = () => {\n        c.style.background = '#fff';\n        c.style.color = '';\n        c.style.borderColor = '';\n        ['--ink', '--ink-2', '--ink-3', '--ink-4', '--hair', '--hair-2', '--grey-2', '--lime-deep'].forEach(p => c.style.removeProperty(p));\n        icons.forEach(sv => sv.style.stroke = '');\n      };\n      c.addEventListener('mouseenter', on);\n      c.addEventListener('mouseleave', off);\n    });\n\n    root.querySelectorAll('[data-chip]').forEach(c => {\n      c.addEventListener('mouseenter', () => { c.style.transform = 'translateY(-2px)'; c.style.borderColor = 'rgba(84,113,31,.4)'; c.style.boxShadow = '0 10px 22px -14px rgba(10,10,10,.3)'; });\n      c.addEventListener('mouseleave', () => { c.style.transform = 'none'; c.style.borderColor = ''; c.style.boxShadow = ''; });\n    });\n    root.querySelectorAll('[data-field]').forEach(f => {\n      f.addEventListener('focus', () => { f.style.borderColor = 'var(--lime)'; f.style.background = 'rgba(255,255,255,.09)'; });\n      f.addEventListener('blur', () => { f.style.borderColor = ''; f.style.background = ''; });\n    });\n\n    // ---- hero composition scaling\n    const box = root.querySelector('[data-scalebox]');\n    const inner = root.querySelector('[data-scaleinner]');\n    if (box && inner) {\n      let sc = 1, px = 0, py = 0, sy = 0;\n      const apply = () => {\n        inner.style.transform = 'translate3d(' + px.toFixed(2) + 'px,' + (py + sy).toFixed(2) + 'px,0) scale(' + sc + ')';\n      };\n      const fit = () => {\n        const w = box.clientWidth;\n        sc = Math.min(1, w / 560);\n        box.style.height = (660 * sc) + 'px';\n        apply();\n      };\n      if (!reduce) {\n        box.addEventListener('mousemove', (e) => {\n          const r = box.getBoundingClientRect();\n          px = ((e.clientX - (r.left + r.width / 2)) / r.width) * 14;\n          py = ((e.clientY - (r.top + r.height / 2)) / r.height) * 10;\n          apply();\n        });\n        box.addEventListener('mouseleave', () => { px = 0; py = 0; apply(); });\n        const onScroll = () => {\n          const r = box.getBoundingClientRect();\n          if (r.bottom < 0 || r.top > window.innerHeight) return;\n          sy = Math.max(-40, Math.min(40, -window.scrollY * 0.05));\n          apply();\n        };\n        window.addEventListener('scroll', onScroll, { passive: true });\n        this._par = onScroll;\n      }\n      fit();\n      this._ro = new ResizeObserver(fit);\n      this._ro.observe(box);\n      window.addEventListener('resize', fit);\n      this._fit = fit;\n    }\n\n    // ---- sticky mobile CTA\n    const sticky = root.querySelector('[data-stickycta]');\n    const target = root.querySelector('#participar');\n    if (sticky && target) {\n      const upd = () => {\n        const narrow = window.innerWidth <= 760;\n        sticky.style.display = narrow ? 'block' : 'none';\n        if (!narrow) return;\n        const past = window.scrollY > window.innerHeight * 0.75;\n        const atForm = target.getBoundingClientRect().top < window.innerHeight * 0.9;\n        sticky.style.transform = (past && !atForm) ? 'translateY(0)' : 'translateY(120%)';\n      };\n      upd();\n      window.addEventListener('scroll', upd, { passive: true });\n      window.addEventListener('resize', upd);\n      this._upd = upd;\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._ro) this._ro.disconnect();\n    if (this._fit) window.removeEventListener('resize', this._fit);\n    if (this._upd) { window.removeEventListener('scroll', this._upd); window.removeEventListener('resize', this._upd); }\n    if (this._par) window.removeEventListener('scroll', this._par);\n    if (this._tl) window.removeEventListener('resize', this._tl);\n  }\n\n  count(el) {\n    if (el.dataset.done) return;\n    el.dataset.done = '1';\n    const target = Number(el.dataset.count);\n    const prefix = el.dataset.prefix || '';\n    const t0 = performance.now(), dur = 1100;\n    const tick = (t) => {\n      const p = Math.min(1, (t - t0) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      el.textContent = prefix + Math.round(target * e);\n      if (p < 1) requestAnimationFrame(tick);\n    };\n    requestAnimationFrame(tick);\n  }\n\n  drawUnderline(el) { el.style.transform = 'scaleX(1)'; }\n\n  draw(el) {\n    const L = el.getTotalLength ? el.getTotalLength() : 0;\n    if (!L) return;\n    el.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(.2,.7,.2,1)';\n    el.style.strokeDashoffset = '0';\n  }\n\n  grow(el) { el.style.transform = 'none'; el.style.opacity = '1'; }\n}\n<\u002Fscript>\n\n\n</body></html>\n"
